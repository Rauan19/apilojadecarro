services:
  postgres:
    image: postgres:17-alpine
    container_name: lojadecarro-postgres
    restart: unless-stopped
    ports:
      - "65432:5432"
    environment:
      POSTGRES_USER: lojadecarro
      POSTGRES_PASSWORD: lojadecarro
      POSTGRES_DB: lojadecarro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lojadecarro -d lojadecarro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lojadecarro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
